plugins {
    id "com.android.application"
}

android {
    namespace "com.hvac.pro.mobile"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.hvac.pro.mobile"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            def storePath = System.getenv("HVAC_ANDROID_KEYSTORE")
            if (storePath) {
                signingConfig signingConfigs.create("upload") {
                    storeFile file(storePath)
                    storePassword System.getenv("HVAC_ANDROID_KEYSTORE_PASSWORD")
                    keyAlias System.getenv("HVAC_ANDROID_KEY_ALIAS")
                    keyPassword System.getenv("HVAC_ANDROID_KEY_PASSWORD")
                }
                signingConfig signingConfigs.upload
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

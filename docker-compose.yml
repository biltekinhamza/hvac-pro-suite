name: hvac_pro_suite

services:
  app:
    build: .
    container_name: hvac_pro_suite_app
    ports:
      - "8010:8010"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:8010
    depends_on:
      - app
    restart: unless-stopped

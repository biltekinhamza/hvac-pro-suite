services:
  app:
    build: .
    container_name: whatsapp_bot_app
    ports:
      - "8010:8010"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:8010
    depends_on:
      - app
    restart: unless-stopped
